server:
  port: 8083

spring:
  application:
    name: smart-city-app
  datasource:
    url: jdbc:h2:mem:citydb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

sdem:
  citizen-service:
    url: http://citizen-app
  provider-service:
    url: http://electricity-provider-app
  # kg of CO2 per kWh for UK grid electricity, used to estimate CO2 avoided by renewables
  grid-carbon-kg-per-kwh: 0.207
