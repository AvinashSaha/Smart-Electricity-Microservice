# Smart City microservice. One instance per city, e.g. --sdem.city.city=sunderland --server.port=8120
sdem:
  data-dir: ./data
  city:
    city: newcastle
    providers: [a, b, c]
    months: 12
    collect-interval: PT30S
    collect-initial-delay: PT20S
  routing:
    # All calls to the providers go through the API gateway
    gateway-url: ${SDEM_GATEWAY_URL:http://localhost:8080}

server:
  port: 8110

spring:
  application:
    name: smartcity-${sdem.city.city}
  datasource:
    url: jdbc:h2:file:${sdem.data-dir}/${spring.application.name};DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
