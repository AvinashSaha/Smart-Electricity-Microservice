name: Sample data and end-to-end run

# Runs the complete system (registry, gateway, main program for all five cities,
# front end), checks it end to end, and commits the resulting database files to
# data/ as sample data. Trigger manually, or push a commit whose message
# contains [sample-data].
on:
  workflow_dispatch:
  push:
    branches: [ '**' ]

permissions:
  contents: write

jobs:
  run-system:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sample-data]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build
        run: mvn -B -q package -DskipTests

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright (for screenshots)
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Start from empty data folder
        run: rm -f data/*.mv.db

      - name: Run the whole system and check it end to end
        env:
          SCREENSHOTS: '1'
        run: ./scripts/smoke-test.sh 2>&1 | tee logs-smoke.txt; exit ${PIPESTATUS[0]}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-logs
          path: logs/

      - name: Report failure details
        if: failure()
        run: |
          report() { # title, file
            [ -s "$2" ] || return 0
            msg=$(sed 's/%/%25/g' "$2" | cut -c1-400 | awk '{printf "%s%%0A", $0}')
            echo "::error title=$1::${msg}"
          }
          tail -25 logs-smoke.txt > a.txt || true; report "Smoke test output" a.txt
          grep -E "ERROR|Exception|Caused by" logs/main-program.log | grep -v "de-registration\|TransportException\|RetryableEureka" | head -25 > b.txt || true; report "Main program errors" b.txt
          grep -E "WARN" logs/main-program.log | grep -v "de-registration\|RetryableEureka" | head -15 > c.txt || true; report "Main program warnings" c.txt
          grep -E "ERROR|Exception" logs/gateway.log | head -10 > d.txt || true; report "Gateway errors" d.txt
          grep -E "ERROR|Exception" logs/front-end.log | head -10 > e.txt || true; report "Front end errors" e.txt

      - name: Commit sample databases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/*.mv.db docs/screenshots/*.png
          git commit -m "Add sample data and screenshots generated from one run of the main program" || echo "No changes"
          git push
