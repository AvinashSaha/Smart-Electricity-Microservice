name: Sample data and end-to-end run

# Runs the complete system (registry, gateway, main program for all five cities,
# front end), checks it end to end, and commits the resulting database files to
# data/ as sample data. Trigger manually, or push a commit whose message
# contains [sample-data].
on:
  workflow_dispatch:
  push:
    branches: [ '**' ]

permissions:
  contents: write

jobs:
  run-system:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sample-data]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build
        run: mvn -B -q package -DskipTests

      - name: Start from empty data folder
        run: rm -f data/*.mv.db

      - name: Run the whole system and check it end to end
        run: ./scripts/smoke-test.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-logs
          path: logs/

      - name: Report failure details
        if: failure()
        run: |
          tail -40 logs/main-program.log | grep -E "ERROR|WARN|Exception" | head -20 | awk '{printf "%s%%0A", $0}' > err.txt || true
          echo "::error title=Main program log::$(cat err.txt)"

      - name: Commit sample databases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/*.mv.db
          git commit -m "Add sample data generated from one run of the main program" || echo "No changes"
          git push
