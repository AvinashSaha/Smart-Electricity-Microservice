server:
  port: 8080

spring:
  application:
    name: sdem-api-gateway
  cloud:
    gateway:
      # Every microservice instance registered in Eureka gets a route automatically:
      #   http://localhost:8080/{service-id}/api/v1/...  ->  that instance
      # e.g. /provider-newcastle-a/api/v1/readings or /smartcity-durham/api/v1/aggregates
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      default-filters:
        - AddResponseHeader=X-SDEM-Gateway, sdem-api-gateway
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "*"
            allowed-methods: [GET, POST, PUT, DELETE, OPTIONS]
            allowed-headers: "*"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true
