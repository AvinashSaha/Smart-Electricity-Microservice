server:
  port: 8080

spring:
  application:
    name: sdem-api-gateway
  cloud:
    gateway:
      routes:
        - id: electricity-provider-app
          uri: lb://electricity-provider-app
          predicates:
            - Path=/api/providers/**
        - id: citizen-app
          uri: lb://citizen-app
          predicates:
            - Path=/api/citizens/**
        - id: smart-city-app
          uri: lb://smart-city-app
          predicates:
            - Path=/api/city/**
      default-filters:
        - AddResponseHeader=X-SDEM-Gateway, sdem-api-gateway
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "*"
            allowed-methods: [GET, POST, PUT, DELETE, OPTIONS]
            allowed-headers: "*"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true
