<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage users')}"></head>
<body>
<div class="shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <main class="main">
        <div th:replace="~{fragments/layout :: alerts}"></div>
        <header class="page-head"><div><p class="eyebrow">Administration</p><h1>Manage users</h1></div></header>
        <div class="two-col">
            <section class="card">
                <h2>Users</h2>
                <table class="data">
                    <thead><tr><th scope="col">User name</th><th scope="col">Role</th><th scope="col"></th></tr></thead>
                    <tbody>
                    <tr th:each="u : ${users}">
                        <td th:text="${u.username()}">name</td>
                        <td><span class="role" th:text="${u.role()}">USER</span></td>
                        <td class="num">
                            <form th:action="@{/admin/users/{name}/delete(name=${u.username()})}" method="post">
                                <button type="submit" class="link-button danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <p class="note">Users are held in memory, so the list returns to the initial users when the application restarts.</p>
            </section>
            <section class="card">
                <h2>Create a user</h2>
                <form th:action="@{/admin/users}" th:object="${form}" method="post" class="form">
                    <label>User name
                        <input type="text" th:field="*{username}" required>
                        <span class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
                    </label>
                    <label>Password (at least 8 characters)
                        <input type="password" th:field="*{password}" autocomplete="new-password" required minlength="8">
                        <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                    </label>
                    <label>Role
                        <select th:field="*{role}">
                            <option value="USER">USER (view data)</option>
                            <option value="ADMIN">ADMIN (view data and manage users)</option>
                        </select>
                    </label>
                    <button type="submit" class="button">Create user</button>
                </form>
            </section>
        </div>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </main>
</div>
</body>
</html>
