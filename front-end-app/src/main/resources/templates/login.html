<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body class="login-page">
<main class="login-card">
    <div class="brand login-brand">
        <span class="brand-mark" aria-hidden="true">NE</span>
        <span class="brand-text">Smart Electricity<small>North East region</small></span>
    </div>
    <h1>Sign in</h1>
    <div class="alert bad" role="alert" th:if="${param.error}">Incorrect user name or password.</div>
    <div class="alert ok" role="status" th:if="${param.logout}">You have been signed out.</div>
    <form th:action="@{/login}" method="post" class="form">
        <label>User name <input type="text" name="username" autocomplete="username" required autofocus></label>
        <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
        <button type="submit" class="button">Sign in</button>
    </form>
    <p class="note">Demo accounts are listed in RUNNING.md.</p>
</main>
</body>
</html>
