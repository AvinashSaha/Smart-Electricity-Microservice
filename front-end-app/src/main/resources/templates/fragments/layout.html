<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/* Shared page parts: head, sidebar navigation, flash messages, footer. */-->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · North East Smart Electricity'">North East Smart Electricity</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<aside th:fragment="sidebar" class="sidebar">
    <a class="brand" th:href="@{/}">
        <span class="brand-mark" aria-hidden="true">NE</span>
        <span class="brand-text">Smart Electricity<small>North East region</small></span>
    </a>
    <nav aria-label="Main">
        <a th:href="@{/}" class="nav-link">Region overview</a>
        <p class="nav-heading">Cities</p>
        <a th:each="c : ${navCities}" th:href="@{/cities/{id}(id=${c.id()})}" class="nav-link" th:text="${c.name()}">City</a>
        <p class="nav-heading">Providers</p>
        <a th:each="p : ${navProviders}" th:href="@{/providers/{code}(code=${#strings.toLowerCase(p.code())})}" class="nav-link" th:text="${p.name()}">Provider</a>
        <p class="nav-heading">Account</p>
        <a th:href="@{/account/password}" class="nav-link">Change password</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}" class="nav-link">Manage users</a>
    </nav>
    <div class="sidebar-user">
        <span>Signed in as <strong sec:authentication="name">user</strong></span>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="link-button">Sign out</button>
        </form>
    </div>
</aside>

<div th:fragment="alerts">
    <div class="alert ok" role="status" th:if="${message}" th:text="${message}"></div>
    <div class="alert bad" role="alert" th:if="${error}" th:text="${error}"></div>
</div>

<div th:fragment="range(path, months)" class="range">
    <span>Period</span>
    <a th:each="m : ${ {3, 6, 12} }" th:href="@{${path}(months=${m})}" th:text="${m} + ' months'"
       th:classappend="${m == months} ? 'active'">12 months</a>
</div>

<footer th:fragment="footer" class="footer">
    Web application v<span th:text="${appVersion}">1.0.0</span>
    · Microservice API <span th:text="${apiVersion}">v1</span>
    · Averages are calculated on demand and never stored
</footer>
</body>
</html>
