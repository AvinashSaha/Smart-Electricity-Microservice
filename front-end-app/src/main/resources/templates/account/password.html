<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Change password')}"></head>
<body>
<div class="shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <main class="main">
        <div th:replace="~{fragments/layout :: alerts}"></div>
        <header class="page-head"><div><p class="eyebrow">Account</p><h1>Change password</h1></div></header>
        <section class="card narrow">
            <form th:action="@{/account/password}" th:object="${form}" method="post" class="form">
                <label>Current password
                    <input type="password" th:field="*{currentPassword}" autocomplete="current-password" required>
                    <span class="field-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></span>
                </label>
                <label>New password (at least 8 characters)
                    <input type="password" th:field="*{newPassword}" autocomplete="new-password" required minlength="8">
                    <span class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
                </label>
                <label>Confirm new password
                    <input type="password" th:field="*{confirmPassword}" autocomplete="new-password" required>
                    <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
                </label>
                <button type="submit" class="button">Change password</button>
            </form>
        </section>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </main>
</div>
</body>
</html>
