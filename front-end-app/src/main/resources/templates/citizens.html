<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Citizens')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <h1>Citizens</h1>

    <table>
        <thead><tr><th>Name</th><th>Postcode</th><th>Meter</th><th>Provider</th><th></th></tr></thead>
        <tbody>
        <tr th:each="c : ${citizens}">
            <td th:text="${c.fullName()}">Name</td>
            <td th:text="${c.postcode()}">NE1</td>
            <td th:text="${c.meterId()}">SM</td>
            <td th:text="${providerNames.get(c.providerId())} ?: ${c.providerId()}">Provider</td>
            <td><a th:href="@{/citizens/{id}(id=${c.id()})}">View</a></td>
        </tr>
        <tr th:if="${#lists.isEmpty(citizens)}"><td colspan="5" class="muted">No citizens yet.</td></tr>
        </tbody>
    </table>

    <h2>Register a citizen</h2>
    <form class="form" method="post" th:action="@{/citizens}" th:object="${form}">
        <label>Full name <input type="text" th:field="*{fullName}" required></label>
        <label>Email <input type="email" th:field="*{email}" required></label>
        <label>Postcode <input type="text" th:field="*{postcode}" placeholder="NE1 8ST" required></label>
        <label>Smart meter ID <input type="text" th:field="*{meterId}" placeholder="SM-2001" required></label>
        <label>Provider
            <select th:field="*{providerId}" required>
                <option th:each="p : ${providers}" th:value="${p.id()}" th:text="${p.name()}">Provider</option>
            </select>
        </label>
        <button type="submit">Register</button>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
