server:
  port: 8090

spring:
  application:
    name: front-end-app
  thymeleaf:
    cache: false

sdem:
  # Every page talks to the microservices through the API gateway
  gateway:
    url: ${SDEM_GATEWAY_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
