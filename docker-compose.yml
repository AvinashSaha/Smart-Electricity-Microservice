# Runs the complete North East system:  docker compose up --build
#   registry  -> gateway -> main program (5 cities: 5 smart city, 15 provider, 5 citizen services) -> front end
# Database files are kept in ./data on the host.
x-health: &health
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 30s

services:
  service-registry-app:
    build: { context: ., args: { MODULE: service-registry-app } }
    ports: ["8761:8761"]
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-sf", "http://localhost:8761/actuator/health"]

  sdem-api-gateway:
    build: { context: ., args: { MODULE: sdem-api-gateway } }
    ports: ["8080:8080"]
    environment:
      EUREKA_URL: http://service-registry-app:8761/eureka
    depends_on:
      service-registry-app: { condition: service_healthy }
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]

  main-program:
    build: { context: ., args: { MODULE: main-program } }
    command: ["--data-dir=/app/data"]
    environment:
      EUREKA_URL: http://service-registry-app:8761/eureka
      SDEM_GATEWAY_URL: http://sdem-api-gateway:8080
      JAVA_TOOL_OPTIONS: -Xmx3g
    volumes:
      - ./data:/app/data
    ports:
      - "8110-8154:8110-8154"
    depends_on:
      sdem-api-gateway: { condition: service_healthy }

  front-end-app:
    build: { context: ., args: { MODULE: front-end-app } }
    ports: ["8090:8090"]
    environment:
      SDEM_GATEWAY_URL: http://sdem-api-gateway:8080
    depends_on:
      sdem-api-gateway: { condition: service_healthy }
