server:
  port: 8082

spring:
  application:
    name: citizen-app
  datasource:
    url: jdbc:h2:mem:citizendb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

sdem:
  # Resolved through Eureka by the load balanced RestClient
  provider-service:
    url: http://electricity-provider-app
